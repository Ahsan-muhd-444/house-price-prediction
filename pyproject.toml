[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "amesml"
dynamic = ["version"]
description = "Reproducible Ames Housing price-prediction pipeline as an installable package, CLI and API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Muhammad Ahsan", email = "ahsanmuhd444@gmail.com" }]
maintainers = [{ name = "Muhammad Ahsan", email = "ahsanmuhd444@gmail.com" }]
keywords = [
  "ames-housing",
  "house-prices",
  "real-estate",
  "machine-learning",
  "scikit-learn",
  "regression",
  "classification",
  "mlops",
  "fastapi",
  "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "pandas>=1.5",
  "numpy>=1.23",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "typer>=0.9",
  "rich>=13",
  "pyyaml>=6",
  "requests>=2.31",
]

[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn>=0.23", "pydantic>=2"]
plots = ["matplotlib>=3.7"]
# The first releases that work with scikit-learn 1.6's estimator tags.
boosting = ["xgboost>=2.1.4", "lightgbm>=4.6"]
test = [
  "amesml[api,plots,boosting]",
  "pytest>=7.4",
  "pytest-cov>=4.1",
  # Starlette's TestClient prefers httpx2 (Python 3.11+) and falls back to httpx.
  "httpx>=0.24",
  "httpx2>=2.0; python_version >= '3.11'",
]
# Linters are pinned so CI does not change behaviour on its own; Dependabot
# proposes upgrades. The tooling needs Python 3.11+, the package itself 3.9+.
dev = [
  "amesml[test]",
  "ruff==0.17.3",
  "mypy==2.4.1; python_version >= '3.11'",
  "pandas-stubs==3.1.0.261029; python_version >= '3.11'",
  "types-PyYAML; python_version >= '3.11'",
  "types-requests; python_version >= '3.11'",
  "pre-commit>=3.5; python_version >= '3.11'",
  "build>=1.0",
  "twine>=5.0",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]
notebook = ["jupyter>=1.0", "matplotlib>=3.7", "seaborn>=0.12"]

[project.urls]
Homepage = "https://github.com/Ahsan-muhd-444/house-price-prediction"
Documentation = "https://ahsan-muhd-444.github.io/house-price-prediction/"
Repository = "https://github.com/Ahsan-muhd-444/house-price-prediction"
Issues = "https://github.com/Ahsan-muhd-444/house-price-prediction/issues"
Changelog = "https://github.com/Ahsan-muhd-444/house-price-prediction/blob/main/CHANGELOG.md"

[project.scripts]
amesml = "amesml.cli:app"

[tool.hatch.version]
path = "src/amesml/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/amesml"]

[tool.hatch.build.targets.sdist]
# The repository also holds the notebook, the report PDF and figures (several
# MB); the source distribution needs only the package, its tests and docs.
include = [
  "/src",
  "/tests",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CITATION.cff",
]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["amesml"]

[tool.mypy]
# mypy 2 can no longer target 3.9 (its oldest target is 3.10). Compatibility
# with 3.9 is checked by running the test suite on it instead.
python_version = "3.10"
strict = true
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# scikit-learn and joblib ship no type information and no maintained stubs
# package exists, so their objects are typed as Any. Everything else, including
# pandas (via pandas-stubs), is checked strictly.
module = ["sklearn", "sklearn.*", "joblib"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "--cov=amesml",
  "--cov-report=term-missing",
  "--cov-fail-under=85",
]
filterwarnings = [
  "error",
  # Starlette's TestClient warns when it falls back from httpx2 to httpx. httpx2
  # needs Python 3.11+, so on 3.10 that fallback cannot be avoided.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
  # matplotlib 3.9, the last release for Python 3.9, calls pyparsing functions
  # that newer pyparsing releases deprecate.
  "ignore:'[A-Za-z]+' deprecated - use '[a-z_]+':UserWarning",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
