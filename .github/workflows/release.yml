name: Release

# Runs when a GitHub release is published (Releases -> Draft a new release).
# Builds the wheel and source distribution and attaches them to the release.
# PyPI publishing can be added later as a trusted-publishing job.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(grep -Po '__version__ = "\K[^"]+' src/amesml/_version.py)
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match the package version ${version}"
            exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  attach:
    name: Attach distributions to the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Upload the wheel and sdist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
