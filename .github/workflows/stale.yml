name: Stale issues

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          exempt-issue-labels: "pinned,security,good first issue,help wanted"
          stale-issue-message: >
            This issue has had no activity for 60 days, so it has been marked as
            stale. It will be closed in 14 days unless there is new activity.
            Leave a comment if it is still relevant.
          close-issue-message: >
            Closing after 74 days without activity. Comment or reopen if this
            still matters.
