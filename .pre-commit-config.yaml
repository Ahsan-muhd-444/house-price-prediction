# Install once with `pre-commit install`; run on everything with
# `pre-commit run --all-files`.
exclude: ^(data/|notebooks/archive/|models/notebook/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
        args: [--unsafe]  # mkdocs.yml uses a !!python/name tag
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  # mypy runs in the project environment (`pip install -e ".[dev]"`) so it sees
  # the same dependencies and stubs as CI, instead of an isolated copy.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy src
        language: system
        types: [python]
        pass_filenames: false
