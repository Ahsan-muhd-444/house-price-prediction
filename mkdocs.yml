site_name: amesml
site_description: Reproducible Ames Housing price prediction as an installable package, CLI and API.
site_author: Muhammad Ahsan
site_url: https://ahsan-muhd-444.github.io/house-price-prediction/
repo_url: https://github.com/Ahsan-muhd-444/house-price-prediction
repo_name: Ahsan-muhd-444/house-price-prediction
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Muhammad Ahsan

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - 5-minute quickstart: getting-started/quickstart.md
  - User Guide:
      - Command line: user-guide/cli.md
      - Python API: user-guide/python-api.md
      - Configuration file: user-guide/configuration.md
      - REST API: user-guide/rest-api.md
      - Docker: user-guide/docker.md
  - Model Card: model_card.md
  - Benchmarks: benchmarks.md
  - Architecture:
      - Overview: architecture.md
      - Design decisions: DECISIONS.md
  - Contributing: contributing.md
  - Changelog: changelog.md
  - API Reference: reference/api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            members_order: source
            separate_signature: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

exclude_docs: |
  ISSUES_TO_FILE.md
